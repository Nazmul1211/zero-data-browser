<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';">
    <title>Aura Browser</title>
    <link rel="stylesheet" href="./renderer.css" />
  </head>
  <body>

    <!-- ░░ TOR LOADING SPLASH (shown until Tor is ready) ░░ -->
    <div id="torSplash" class="tor-splash">
      <div class="tor-splash-inner">
        <div class="tor-logo">🔒</div>
        <h2 class="tor-title">Aura Browser</h2>
        <p class="tor-sub">Setting up the Secure Tunnel…</p>
        <div class="tor-spinner-wrap">
          <div class="tor-spinner"></div>
        </div>
        <p id="torStatusText" class="tor-status">Connecting to Tor network…</p>
      </div>
    </div>

    <header class="toolbar">
      <div class="chrome-topbar">
        <div class="brand-lockup" aria-label="Aura Browser">
          <span class="brand-mark"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 22h20L12 2z"></path></svg></span>
          <span class="brand-name">Aura</span>
        </div>
        <div id="tabsContainer" class="tabs-container" role="tablist">
          <button id="newTabBtn" class="new-tab-btn" title="New Tab" aria-label="New Tab">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
        </div>
      </div>

      <div class="navigation-bar">
        <div class="nav-group" aria-label="Navigation">
          <button id="backButton" class="nav-btn" title="Back" aria-label="Back">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>
          <button id="forwardButton" class="nav-btn" title="Forward" aria-label="Forward">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
          <button id="reloadButton" class="nav-btn" title="Reload" aria-label="Reload">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
          </button>
          <button id="homeButton" class="nav-btn" title="Home" aria-label="Home">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          </button>
        </div>

        <div class="address-bar-container">
          <button id="securityIndicator" class="security-chip clickable-indicator" title="Connection Security" aria-label="Connection Security">
            <span class="security-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></span>
            <span class="security-text">Secure</span>
          </button>
          <button id="privacyShieldBtn" class="addr-btn privacy-shield-btn" title="Privacy Dashboard" aria-label="Privacy Dashboard">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
          </button>
          <div id="identityBadge" class="identity-badge" title="Current Identity Container">
            <span class="id-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></span>
            <span class="id-text">Personal</span>
          </div>
          <input id="addressInput" type="text" placeholder="Search or enter web address  (⌘K)" autocomplete="off" spellcheck="false" />
          <button id="readerModeBtn" class="addr-btn" title="Toggle Reader Mode" aria-label="Toggle Reader Mode">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
          </button>
        </div>

        <div class="action-group" aria-label="Browser tools">
          <button id="splitViewBtn" class="action-btn" title="Split View" aria-label="Split View">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="3" x2="12" y2="21"></line></svg>
          </button>
          <button id="burnBtn" class="burn-btn" title="Panic: Burn All Data" aria-label="Burn All Data">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>
          </button>
          <button id="settingsToggleBtn" class="action-btn" title="Settings" aria-label="Settings">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          </button>
        </div>
      </div>
    </header>

    <!-- ░░ PERMISSION PROMPT ░░ -->
    <div id="permissionPrompt" class="permission-prompt hidden">
      <div class="perm-icon">🔒</div>
      <div class="perm-content">
        <div class="perm-title" id="permTitle">example.com</div>
        <div class="perm-desc">wants to use your <strong id="permDesc">camera</strong></div>
      </div>
      <div class="perm-actions">
        <button class="perm-btn perm-allow" id="permAllow">Allow for Session</button>
        <button class="perm-btn perm-deny" id="permDeny">Block</button>
      </div>
    </div>

    <!-- ░░ DOWNLOAD MANAGER ░░ -->
    <div id="burnOverlay" class="burn-overlay hidden">
      <div class="burn-content">
        <p>Are you sure you want to Burn?</p>
        <p style="font-size: 13px; color: #9ba8bf; margin-top: 8px;">This will close all tabs, destroy all identity sessions, wipe your clipboard, and erase all temporary data. This cannot be undone.</p>
        <div class="burn-actions" style="margin-top: 16px;">
          <button id="burnConfirm" class="burn-btn confirm">Burn</button>
          <button id="burnCancel" class="burn-btn cancel">Cancel</button>
        </div>
      </div>
    </div>

    <!-- ░░ BURN FLASH OVERLAY (replaces body opacity hack) ░░ -->
    <div id="burnFlash" class="burn-flash hidden"></div>

    <script src="./renderer.js"></script>
  </body>
</html>
